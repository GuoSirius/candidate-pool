name: EOD Tail Screening

# 尾盘选股（14:50 固定口径）。为什么由程序内等待而非把 cron 设在 14:50：
# GitHub 的 schedule cron 有 1–5 分钟级的触发延迟，若恰好在 14:50 触发，
# 实际开始抓数可能是 14:53——分时数据虽完整（barAtOrBefore 兜底），但存在
# 「行情时间戳落后 45 分钟即判陈旧」等边界风险。故 cron 设在 14:40（06:40 UTC），
# 由 tail_screener.js --wait 在 Runner 内等到 14:50 再开始抓取。

on:
  # GitHub 原生定时 + timezone（IANA 时区名，cron 直接写北京时间）：
  # 40 14 Asia/Shanghai = 14:40 北京，等价旧 UTC 写法 40 6；分钟避开整点/半点，降低调度排队概率。
  # 程序内 --wait 等到 14:50 再抓取，勿把 cron 直接设到 14:50（调度延迟会顶破口径边界）。
  schedule:
    - cron: "40 14 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      wait:
        description: "是否程序内等到 14:50 再跑（手动补跑选 false）"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

# 同一工作流同时最多一个运行实例：调度延迟导致重叠触发时，取消旧实例、只保留最新一次。
# ⚠️ group 必须按工作流隔离（不可共用 daily-screening）：daily-screen / tail-observe /
# tail-screen 是三个互不相干的定时任务，共用 group 会互相取消（观察 14:30 跑时会把
# 15:37 的初筛排队项取消掉）。防「同工作流重复执行」由本块完整覆盖，无需额外检查步骤
# ——cancel-in-progress: true 时，旧实例仍在运行则新实例在启动前即被取消，永远跑不到步骤里。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Runner 默认 UTC；统一锁到北京时间，保证日志/脚本里的 date 口径一致
    env:
      TZ: Asia/Shanghai
    steps:
      # -----------------------------------------------------------------------
      # 调试步骤：量化「计划触发 vs 实际启动」的延迟，并确认 Runner 时钟口径。
      # -----------------------------------------------------------------------
      - name: Debug time info (触发时刻 / Runner 时钟)
        run: |
          echo "GITHUB_EVENT_NAME = $GITHUB_EVENT_NAME"
          CRON="${{ github.event.schedule || 'N/A（非 schedule 触发）' }}"
          echo "计划 cron        = $CRON   （schedule 事件里 github.event.schedule 是 cron 表达式，不是时间戳）"
          echo "实际启动 (UTC)   = $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "实际启动 (上海)  = $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Runner TZ env    = ${TZ:-<未设置>}"
          echo "run_id=${{ github.run_id }} number=${{ github.run_number }} attempt=${{ github.run_attempt }}"
          # 计算「计划触发(上海) vs 实际启动」延迟：从 cron 解析 分/时（北京时间直写）。
          # cron 字段非纯数字（如 */5）或解析失败则跳过延迟打印，不影响其他诊断。
          CM=$(echo "$CRON" | cut -d' ' -f1)
          CH=$(echo "$CRON" | cut -d' ' -f2)
          if [ "$CM" -eq "$CM" ] 2>/dev/null && [ "$CH" -eq "$CH" ] 2>/dev/null; then
            TARGET=$(TZ=Asia/Shanghai date -d "today ${CH}:${CM}" +%s 2>/dev/null)
            NOW_TS=$(date -u +%s)
            if [ -n "$TARGET" ]; then
              echo "计划触发 (上海)  = $(TZ=Asia/Shanghai date -d @$TARGET '+%Y-%m-%d %H:%M:%S %Z')"
              echo "触发延迟         = $(( (NOW_TS - TARGET) / 60 )) 分钟（正=晚于计划；>30 属 GitHub 调度排队）"
            fi
          fi

      # Runner 镜像默认 UTC。job 级 env.TZ 已让 date 等工具按上海时间输出；
      # timedatectl 在容器化 Runner 上通常无 systemd 而失败，仅作辅助尝试，失败不阻断。
      - name: Set timezone (Asia/Shanghai)
        run: |
          sudo timedatectl set-timezone Asia/Shanghai \
            || echo "::notice::timedatectl 不可用（容器环境无 systemd），时区由 env TZ 保证"
          echo "TZ=Asia/Shanghai" >> "$GITHUB_ENV"
          echo "Runner 本地时间  = $(date '+%Y-%m-%d %H:%M:%S %Z')"

      # 延迟识别：GitHub 调度器常排队数小时（本次实测 ~5h）。若 Runner 启动已晚于
      # 尾盘抓取窗口收盘时刻（15:00 北京），不再「整条跳过」，而是继续跑——
      # 但加 --no-d1 --force：不污染线上 Cloudflare D1 数据源（避免错误/收盘后数据
      # 写进网页 /api/tail/*），仍照常产出本地 HTML/JSON 并推到 daily-artifacts 供分发。
      # daily-screen（抓已收盘定型的次日候选）不受影响，不加护栏。
      - name: Guard - detect delayed past capture window
        id: guard
        run: |
          NOW_BJ=$(TZ=Asia/Shanghai date +%H%M)
          CAP=1500   # 15:00 北京 = 收盘
          if [ "$NOW_BJ" -gt "$CAP" ]; then
            echo "::warning::Runner 启动于 ${NOW_BJ} 北京，晚于尾盘抓取窗口（已收盘）；仍产出 HTML/JSON 到 daily-artifacts，但跳过 D1 同步（--no-d1 --force）"
            echo "NO_SYNC=1" >> "$GITHUB_ENV"
          else
            echo "启动于 ${NOW_BJ} 北京，在窗口内，正常执行"
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies (dayjs)
        run: npm ci

      # 行业映射：直接用 checkout 出来的 main 副本（eod/data/industry-map.json 已入库，
      # 由 refresh-industry-map.yml 月更到 main）。不再从 daily-artifacts 覆盖——那里的副本可能比 main 旧。

      - name: Run tail screening (尾盘选股 + 报告 + 推送)
        id: live
        continue-on-error: true
        env:
          # D1 凭据：尾盘结果由脚本内 syncTailRun 直接写入 Cloudflare D1（网页 /api/tail/* 的数据源）。
          # 与 daily-screen.yml 同一套 Secrets；缺失时脚本会静默跳过 D1（仅留本地 JSON），
          # 故「GitHub 主」模式下这几项必填。
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NOTIFY_WX_PROVIDER: ${{ secrets.NOTIFY_WX_PROVIDER }}
          NOTIFY_WX_KEY: ${{ secrets.NOTIFY_WX_KEY }}
          NOTIFY_WX_TOKEN: ${{ secrets.NOTIFY_WX_TOKEN }}
          NOTIFY_MAIL_SENDER: ${{ secrets.NOTIFY_MAIL_SENDER }}
          NOTIFY_MAIL_AUTH: ${{ secrets.NOTIFY_MAIL_AUTH }}
          NOTIFY_MAIL_RECEIVER: ${{ secrets.NOTIFY_MAIL_RECEIVER }}
          NOTIFY_MAIL_HOST: ${{ secrets.NOTIFY_MAIL_HOST }}
          NOTIFY_MAIL_PORT: ${{ secrets.NOTIFY_MAIL_PORT }}
        run: |
          ARGS=""
          if [ "$NO_SYNC" = "1" ]; then ARGS="--no-d1 --force"; fi
          if [ "${{ github.event.inputs.wait }}" = "true" ]; then
            node eod/tail_screener.js --wait $ARGS
          else
            node eod/tail_screener.js $ARGS
          fi

      # ---------------------------------------------------------------------
      # 产物（报告 + 日度 JSON）提交到 daily-artifacts 分支，与每日初筛共用一个
      # 留档分支；报告也可在 Actions 页面直接下载。
      # ---------------------------------------------------------------------
      - name: Commit artifacts to daily-artifacts branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin daily-artifacts --depth 1 || true
          if git rev-parse --verify origin/daily-artifacts >/dev/null 2>&1; then
            BASE=origin/daily-artifacts
          else
            BASE=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "init artifacts branch")
          fi
          git worktree add --detach _artifacts "$BASE"
          mkdir -p _artifacts/eod/reports _artifacts/eod/data
          cp -r eod/reports/. _artifacts/eod/reports/ 2>/dev/null || true
          cp -r eod/data/. _artifacts/eod/data/ 2>/dev/null || true
          cd _artifacts
          git add -A eod
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 尾盘选股 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/daily-artifacts
          fi
          cd ..
          git worktree remove _artifacts --force

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: tail-report
          path: |
            eod/reports/
            eod/data/eod-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report failure (标红 + 微信告警)
        if: ${{ steps.live.outcome == 'failure' }}
        env:
          NOTIFY_WX_PROVIDER: ${{ secrets.NOTIFY_WX_PROVIDER }}
          NOTIFY_WX_KEY: ${{ secrets.NOTIFY_WX_KEY }}
          NOTIFY_WX_TOKEN: ${{ secrets.NOTIFY_WX_TOKEN }}
        run: |
          echo "::warning::尾盘选股失败，请查看日志"
          node notify.js --send \
            "⚠️ 尾盘选股失败（GitHub Actions）" \
            "今日尾盘选股在 GitHub Runner 上执行失败，**本次没有 14:50 口径结果**。

          常见原因：腾讯行情接口被拦（WAF / 超时）或行业映射缺失。
          运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
