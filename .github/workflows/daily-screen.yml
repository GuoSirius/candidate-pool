name: Daily A-Share Screening

# 数据源为腾讯公开行情接口（qt.gtimg.cn / web.ifzq.gtimg.cn），不依赖任何本机技能或 CLI，
# 因此实时模式可直接跑在 GitHub 托管 Runner 上，不再需要 self-hosted runner。

on:
  # 每个交易日 15:30（北京时间，周一至周五）由本地准点 dispatch 触发器触发，走实时抓取。
  # 触发命令：scripts/trigger-github-dispatch.mjs --workflow daily --input mode=live
  # 为何 15:30 可行：gen_candidates.js 的 lastClosedTradingDay() 以「hour < 15」为界判「未收盘」，
  # 15:30 已过界，锚定日仍是【当日】而非前一交易日；此时 A 股已收盘 30 分钟，日线收盘数据已定稿。
  # （已删除 GitHub schedule cron；公开仓库调度延迟 ~6.5h 会落到晚间，且会与本地 dispatch 双触发）
  workflow_dispatch:
    inputs:
      mode:
        description: "live = 实时抓取（默认）；offline = 从仓库内已提交快照重建报告"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - offline
      date:
        description: "锚定日（YYYY-MM-DD，留空 = 最近一个已收盘交易日）"
        required: false
        type: string

# 允许工作流把生成的报告与快照写回仓库
permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    # CF_* 提到 job 级：`if: env.X != ''` 只能可靠读到 workflow / job 级 env。
    # 原先把这三个写在各个 step 自己的 env 里、又用同一步骤的 if 去判它，
    # 而「step 自身 env 在 if 求值时是否已生效」官方没有保证（见 Contexts 可用性表），
    # 属于隐患 —— 一旦恒为假，结构同步与入库都会被静默跳过。
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # dayjs 为运行时依赖，需先安装（此前为零依赖，可直接 node 运行）
      - name: Install dependencies (dayjs)
        run: npm ci

      # -----------------------------------------------------------------------
      # 预取 latest 快照：从 daily-artifacts 分支把 data/ 拉进工作树，供离线兜底使用。
      # 若 daily-artifacts 尚未创建则跳过（首次运行走实时，无需兜底）。
      # -----------------------------------------------------------------------
      - name: Seed latest snapshot for offline fallback
        run: |
          git fetch origin daily-artifacts --depth 1 || true
          git checkout origin/daily-artifacts -- data/ 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 实时抓取。若腾讯接口在 Runner 所在网络不可达，则不让整个工作流失败，
      # 转由下一步用仓库内最新快照重建报告，保证每天都有产物。
      # -----------------------------------------------------------------------
      - name: Run live screening (实时抓取 + 按日留档 + 推送)
        id: live
        if: ${{ github.event.inputs.mode != 'offline' }}
        continue-on-error: true
        env:
          NOTIFY_WX_PROVIDER: ${{ secrets.NOTIFY_WX_PROVIDER }}
          NOTIFY_WX_KEY: ${{ secrets.NOTIFY_WX_KEY }}
          NOTIFY_WX_TOKEN: ${{ secrets.NOTIFY_WX_TOKEN }}
          NOTIFY_MAIL_SENDER: ${{ secrets.NOTIFY_MAIL_SENDER }}
          NOTIFY_MAIL_AUTH: ${{ secrets.NOTIFY_MAIL_AUTH }}
          NOTIFY_MAIL_RECEIVER: ${{ secrets.NOTIFY_MAIL_RECEIVER }}
          NOTIFY_MAIL_HOST: ${{ secrets.NOTIFY_MAIL_HOST }}
          NOTIFY_MAIL_PORT: ${{ secrets.NOTIFY_MAIL_PORT }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node gen_candidates.js --date "${{ github.event.inputs.date }}"
          else
            node gen_candidates.js
          fi

      # -----------------------------------------------------------------------
      # 兜底/显式离线：取工作树内日期最新的一份快照重建 HTML
      # （工作树 data/ 已由上一步从 daily-artifacts 预取，或本次实时运行刚写入）
      # -----------------------------------------------------------------------
      - name: Rebuild from latest snapshot (离线兜底)
        if: ${{ github.event.inputs.mode == 'offline' || steps.live.outcome == 'failure' }}
        run: |
          SNAP="$(ls -1 data/snapshot-*.json 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SNAP" ]; then
            echo "::error::未找到任何快照文件，无法离线重建"
            exit 1
          fi
          DATE="$(basename "$SNAP" .json | sed 's/^snapshot-//')"
          OUT="reports/stock_list_$(echo "$DATE" | tr -d '-').html"
          echo "使用快照 $SNAP -> $OUT"
          node gen_candidates.js --offline --snapshot "$SNAP" --out "$OUT" --quiet

      # -----------------------------------------------------------------------
      # 产物提交到独立分支 daily-artifacts（不污染 main 代码分支）：
      # 用 git worktree 在一个独立工作树里把本次报告/快照提交并推到 daily-artifacts，
      # 主工作树（main）保持不动，后续 D1 入库步骤仍可正常读取本地 data/。
      # 本地仍可照常把产物提交到 main，与定时任务写入的 daily-artifacts 互不影响。
      # -----------------------------------------------------------------------
      - name: Commit artifacts to daily-artifacts branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf _artifacts
          git fetch origin daily-artifacts --depth 1 || true
          if git rev-parse --verify origin/daily-artifacts >/dev/null 2>&1; then
            BASE=origin/daily-artifacts
          else
            BASE=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "init artifacts branch")
          fi
          git worktree add --detach _artifacts "$BASE"
          rm -rf _artifacts/reports _artifacts/data
          mkdir -p _artifacts/reports _artifacts/data
          cp -r reports/. _artifacts/reports/ 2>/dev/null || true
          cp -r data/. _artifacts/data/ 2>/dev/null || true
          cd _artifacts
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日初筛 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/daily-artifacts
          fi
          cd ..
          git worktree remove _artifacts --force

      # -----------------------------------------------------------------------
      # 结构同步：把 db/schema.sql（唯一真相源）幂等应用到生产 D1 —— 只补缺的表 / 索引，
      # 已存在的一律不动，可无限重复执行。
      # 为什么必须有这一步（2026-09-21 事故）：schema.sql 改了之后，原先没有任何自动
      # 应用路径（本地 sqlite 只在「缺 run_batch 表」时才建表、远程完全靠人工
      # wrangler d1 execute），于是新加的 tail_run / tail_pick 线上从未被创建，
      # /api/tail/* 全部 no such table → 四个页面 500。
      # 位置刻意放在「报告生成 + 产物提交」之后：结构问题不会拖累当天报告的产出。
      # -----------------------------------------------------------------------
      - name: Apply schema to D1 (结构同步)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: node db/migrate.js

      # -----------------------------------------------------------------------
      # 入库同步：把当日（及全部历史）快照规范化写入 Cloudflare D1（生产存储）。
      # 仅当仓库 Secrets 配置了 CF_API_TOKEN 才执行；未配置时自动跳过，不阻断报告。
      # 写入幂等（run_batch UNIQUE anchor_date；pick_record UNIQUE(run_id,code)），
      # 重复跑不会重复插入。
      # -----------------------------------------------------------------------
      - name: Sync to Cloudflare D1 (入库同步)
        id: d1
        if: ${{ env.CF_API_TOKEN != '' }}
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node db/backfill.js

      # -----------------------------------------------------------------------
      # 实时失败必须【主动告警】。否则用户在 15:30 只是收不到微信，很容易误以为
      # 「今天没有候选」，而不是「任务挂了」——静默失败比报错危险得多。
      # -----------------------------------------------------------------------
      - name: Report live failure (标红 + 微信告警)
        if: ${{ steps.live.outcome == 'failure' }}
        env:
          NOTIFY_WX_PROVIDER: ${{ secrets.NOTIFY_WX_PROVIDER }}
          NOTIFY_WX_KEY: ${{ secrets.NOTIFY_WX_KEY }}
          NOTIFY_WX_TOKEN: ${{ secrets.NOTIFY_WX_TOKEN }}
        run: |
          echo "::warning::实时抓取失败，本次产物由历史快照重建，数据非当日口径。请检查腾讯行情接口可达性。"
          node notify.js --send \
            "⚠️ A股初筛失败（实时抓取中止）" \
            "今日实时抓取未完成，**本次没有当日数据**。报告已用历史快照重建，仅供占位，请勿据此决策。

          常见原因：腾讯行情接口 WAF 拦截（HTTP 501）或 Runner 网络不可达。
          排查：查看 Actions 日志中「K线失败 x/y（其中被拦截 z）」一行。
          运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
