name: Publish to npm and GitHub Release

# 发布链路（本机**不执行** npm publish，与 yyds / change-image-suffix / uuid-nanoid 一致）：
#   本机 npm run release  →  bump 版本 + 写 CHANGELOG + 提交 + 打 tag + push + 部署
#        ↓  tag 推送触发本工作流
#   GitHub Actions        →  校验版本 → 自测 → 打包体检 → npm publish → 建 GitHub Release
#
# 为什么 publish 放 CI 而不是本机：
#   1) 本机不必持有 npm 凭据，令牌只存在仓库 Secret（NPM_TOKEN）里；
#   2) publish 前必然过一遍自测 + 打包体检（敏感文件守门），本机漏跑也拦得住；
#   3) 顺带拿到 npm provenance 签名（OIDC，需 id-token: write + 仓库公开）。

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # 建 Release
  id-token: write   # npm provenance（不可省，否则 --provenance 报错）

# 同一个 tag 只允许一次发布在跑；不取消进行中的，避免留下半发布状态
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Release 说明要读全量 tag 与提交历史

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # tag 与 package.json 版本不一致 = 发出去的东西和标签对不上，必须拦住。
      # （changelogen --bump 会同时改 package.json 与 tag，这里交叉校验兜底）
      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) 与 package.json 版本 ($PKG) 不一致，拒绝发布"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # 三个自测全部离线（不碰行情接口）：路径解析 41 项 / 时段 60 项 / 结构同步 19 项
      - name: Run self tests
        run: npm run selftest

      # files 白名单会绕过 .gitignore —— 曾把 db/.env（Cloudflare 令牌）打进 tarball。
      # 这一步在 publish 之前，命中即失败；同时校验必需文件齐全与体积红线。
      - name: Verify package integrity
        run: npm run verify:pack

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 说明优先取 CHANGELOG.md 的本版本段落，取不到则现场用 git log 按同一套 type 分组兜底
      - name: Generate release notes
        run: node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --out release-notes.md --install

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## ✅ Published"
            echo ""
            echo "- **Package**: \`${NAME}\`"
            echo "- **Version**: \`${VERSION}\`"
            echo "- **npm**: https://www.npmjs.com/package/${NAME}/v/${VERSION}"
            echo "- **Release**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          } >> $GITHUB_STEP_SUMMARY
